# p6spy configuration

# Log output via slf4j (uses Spring logging system)
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# SQL formatter: outputs actual SQL with bound parameters
logMessageFormat=com.p6spy.engine.spy.appender.MultiLineFormat

# Custom format: execution time (ms) + actual SQL
customLogMessageFormat=\nExecution Time: %(executionTime) ms\n%(sqlSingleLine)

# Slow query threshold (seconds) - logs WARN if exceeded
outagedetection=true
outagedetectioninterval=3

# Exclude noise categories, show only actual SQL with parameters
excludecategories=info,debug,result,resultset
